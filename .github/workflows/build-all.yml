name: Multi-Platform Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      build_number:
        description: 'Build number (e.g., 1)'
        required: false
        default: '1'

env:
  APP_NAME: discipulus
  APP_ID: dev.harrydekat.discipulus

jobs:
  version:
    name: Prepare Versioning
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_vars.outputs.version }}
      build_number: ${{ steps.get_vars.outputs.build_number }}
    steps:
      - name: Set Variables
        id: get_vars
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.event.inputs.build_number }}" >> $GITHUB_OUTPUT

  build-apple:
    name: Apple Platforms (iOS, macOS, watchOS)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Apple Secrets
        shell: bash
        env:
          SECRETS_B64: ${{ secrets.BUILD_SECRETS_BASE64 }}
        run: |
          if [ -n "$SECRETS_B64" ]; then
            python3 -c '
          import os, base64, json, tarfile, io

          raw = base64.b64decode(os.environ.get("SECRETS_B64", ""))
          profiles_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          xcode_pdir = os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles")
          os.makedirs(profiles_dir, exist_ok=True)
          os.makedirs(xcode_pdir, exist_ok=True)

          # Try tar.gz / xz archive
          try:
              with tarfile.open(fileobj=io.BytesIO(raw), mode="r:*") as tar:
                  for member in tar.getmembers():
                      if member.name.endswith(".mobileprovision") or member.name.endswith(".provisionprofile"):
                          fbytes = tar.extractfile(member).read()
                          with open(os.path.join(profiles_dir, member.name), "wb") as pf:
                              pf.write(fbytes)
                          with open(os.path.join(xcode_pdir, member.name), "wb") as pf:
                              pf.write(fbytes)
                      elif member.name.endswith(".p12"):
                          tar.extract(member, path=".")
                      elif member.name in ["cert_pass.txt", "password.txt"]:
                          tar.extract(member, path=".")
          except Exception as te:
              # Fallback to JSON format
              try:
                  data = json.loads(raw.decode("utf-8"))
                  apple = data.get("apple", {})
                  if "certificate_base64" in apple and apple["certificate_base64"]:
                      with open("cert.p12", "wb") as cf:
                          cf.write(base64.b64decode(apple["certificate_base64"]))
                  if "certificate_password" in apple:
                      with open("cert_pass.txt", "w") as pf:
                          pf.write(apple["certificate_password"])
                  if "provisioning_profile_base64" in apple:
                      with open(os.path.join(profiles_dir, "profile.mobileprovision"), "wb") as pf:
                          pf.write(base64.b64decode(apple["provisioning_profile_base64"]))
                  if "provisioning_profiles" in apple:
                      profiles = apple["provisioning_profiles"]
                      if isinstance(profiles, dict):
                          for name, b64 in profiles.items():
                              ext = ".provisionprofile" if name.endswith(".provisionprofile") else ".mobileprovision"
                              fname = name if name.endswith(".mobileprovision") or name.endswith(".provisionprofile") else f"{name}{ext}"
                              with open(os.path.join(profiles_dir, fname), "wb") as pf:
                                  pf.write(base64.b64decode(b64))
                      elif isinstance(profiles, list):
                          for idx, b64 in enumerate(profiles):
                              with open(os.path.join(profiles_dir, f"profile_{idx}.mobileprovision"), "wb") as pf:
                                  pf.write(base64.b64decode(b64))
              except Exception as je:
                  print(f"Warning parsing Apple secrets: {te} / {je}")
          '
          fi

      - name: Install Certificates
        shell: bash
        run: |
          CERT_PASS=""
          if [ -f cert_pass.txt ]; then
            CERT_PASS=$(cat cert_pass.txt)
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="actions"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          for p12 in *.p12; do
            if [ -f "$p12" ]; then
              echo "Importing $p12 into $KEYCHAIN_PATH..."
              security import "$p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -A -T /usr/bin/codesign -T /usr/bin/security
            fi
          done

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f *.p12 cert_pass.txt

      - name: Disable SPM & Pub Get
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Configure iOS Code Signing & ExportOptions
        shell: bash
        run: |
          python3 -c '
          import os, subprocess, plistlib, re, json

          profiles_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          store_uuid_mapping = {}
          dev_uuid_mapping = {}

          if os.path.exists(profiles_dir):
              for fname in os.listdir(profiles_dir):
                  if fname.endswith(".mobileprovision"):
                      fpath = os.path.join(profiles_dir, fname)
                      res = subprocess.run(["security", "cms", "-D", "-i", fpath], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      if res.returncode == 0:
                          pl = plistlib.loads(res.stdout)
                          app_id = pl.get("Entitlements", {}).get("application-identifier", "")
                          if "." in app_id:
                              bundle_id = app_id.split(".", 1)[1]
                              name = pl.get("Name", "")
                              uuid = pl.get("UUID")
                              if "Store" in name:
                                  store_uuid_mapping[bundle_id] = uuid
                                  print(f"Store Profile: {bundle_id} -> UUID {uuid} ({name})")
                              else:
                                  dev_uuid_mapping[bundle_id] = uuid
                                  print(f"Dev Profile: {bundle_id} -> UUID {uuid} ({name})")

          active_mapping = store_uuid_mapping if store_uuid_mapping else dev_uuid_mapping
          export_method = "app-store" if store_uuid_mapping else "development"
          print(f"Export method configured: {export_method} with {len(active_mapping)} profiles")

          # 1. Update project.pbxproj safely using plutil JSON/XML conversion
          pbx_path = "ios/Runner.xcodeproj/project.pbxproj"
          if os.path.exists(pbx_path) and active_mapping:
              res = subprocess.run(["plutil", "-convert", "json", "-o", "-", pbx_path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if res.returncode == 0:
                  data = json.loads(res.stdout)
                  objects = data.get("objects", {})
                  count = 0
                  for key, obj in objects.items():
                      if isinstance(obj, dict) and obj.get("isa") == "XCBuildConfiguration":
                          bs = obj.get("buildSettings", {})
                          bundle_id = bs.get("PRODUCT_BUNDLE_IDENTIFIER")
                          if bundle_id in active_mapping:
                              bs["CODE_SIGN_STYLE"] = "Automatic"
                              bs["DEVELOPMENT_TEAM"] = "DUGUWCFH8P"
                              bs.pop("PROVISIONING_PROFILE", None)
                              bs.pop("PROVISIONING_PROFILE_SPECIFIER", None)
                              count += 1
                  with open(pbx_path, "w") as f:
                      json.dump(data, f)
                  subprocess.run(["plutil", "-convert", "xml1", pbx_path])
                  print(f"Successfully configured {count} build configurations in project.pbxproj")

          # 2. Generate ExportOptions.plist
          export_options = {
              "destination": "export",
              "method": export_method,
              "signingStyle": "automatic",
              "teamID": "DUGUWCFH8P",
              "manageAppVersionAndBuildNumber": False,
              "uploadSymbols": True,
          }

          os.makedirs("ios", exist_ok=True)
          with open("ios/ExportOptions.plist", "wb") as f:
              plistlib.dump(export_options, f)

          print(f"Generated ios/ExportOptions.plist (method: {export_method})")
          '

      - name: Build iOS IPA
        run: |
          if flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}; then
            echo "IPA build succeeded."
          elif [ -d "build/ios/archive/Runner.xcarchive" ] && xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions.plist -allowProvisioningUpdates; then
            echo "Direct xcodebuild exportArchive succeeded."
          else
            echo "IPA export failed, fallback to unsigned iOS build..."
            flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -R Runner.app Payload/
            zip -qr ../../../${{ env.APP_NAME }}_ios_unsigned.ipa Payload
            rm -rf Payload
            cd ../../..
          fi

      - name: Build macOS App
        run: |
          if flutter build macos --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}; then
            echo "Standard macOS build succeeded."
          else
            echo "Standard macOS build failed, building with ad-hoc code signing..."
            cd macos
            xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGN_STYLE="Manual" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              DEVELOPMENT_TEAM="" \
              build
            cd ..
          fi
          if [ -d "build/macos/Build/Products/Release" ]; then
            cd build/macos/Build/Products/Release
            zip -r ../../../../../${{ env.APP_NAME }}_macos.zip *.app
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Upload Apple Artifacts (iOS includes embedded watchOS)
        uses: actions/upload-artifact@v4
        with:
          name: apple-builds
          path: |
            build/ios/ipa/*.ipa
            *.ipa
            ${{ env.APP_NAME }}_macos.zip

  build-android-linux:
    name: Android, Wear OS & Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkit2gtk-4.1-dev flatpak flatpak-builder

      - name: Decode Android Secrets
        shell: bash
        env:
          SECRETS_B64: ${{ secrets.BUILD_SECRETS_BASE64 }}
        run: |
          if [ -n "$SECRETS_B64" ]; then
            python3 -c '
          import os, base64, json, tarfile, io

          raw = base64.b64decode(os.environ.get("SECRETS_B64", ""))
          os.makedirs("android/app", exist_ok=True)
          env_lines = []

          # Try tar.gz archive
          try:
              with tarfile.open(fileobj=io.BytesIO(raw), mode="r:*") as tar:
                  for member in tar.getmembers():
                      if member.name.endswith(".jks"):
                          tar.extract(member, path="android/app")
                          extracted_file = os.path.join("android/app", member.name)
                          target_file = "android/app/keystore.jks"
                          if extracted_file != target_file:
                              os.rename(extracted_file, target_file)
                          env_lines.append("CM_KEYSTORE_PATH=keystore.jks")
                      elif member.name == "password.txt":
                          tar.extract(member, path=".")
                          alias = "discipulus"
                          password = ""
                          with open("password.txt") as pf:
                              for line in pf:
                                  if line.startswith("Password:"):
                                      password = line.split(":", 1)[1].strip()
                                  elif line.startswith("Alias:"):
                                      alias = line.split(":", 1)[1].strip()
                          if password:
                              env_lines.extend([
                                  f"CM_KEYSTORE_PASSWORD={password}",
                                  f"CM_KEY_ALIAS={alias}",
                                  f"CM_KEY_PASSWORD={password}"
                              ])
                          if os.path.exists("password.txt"):
                              os.remove("password.txt")
          except Exception as te:
              # Fallback to JSON format
              try:
                  data = json.loads(raw.decode("utf-8"))
                  android = data.get("android", {})
                  if "keystore_base64" in android and android["keystore_base64"]:
                      with open("android/app/keystore.jks", "wb") as kf:
                          kf.write(base64.b64decode(android["keystore_base64"]))
                      env_lines.append("CM_KEYSTORE_PATH=keystore.jks")
                  if "keystore_password" in android:
                      kp = android["keystore_password"]
                      env_lines.append(f"CM_KEYSTORE_PASSWORD={kp}")
                  if "key_alias" in android:
                      ka = android["key_alias"]
                      env_lines.append(f"CM_KEY_ALIAS={ka}")
                  if "key_password" in android:
                      ap = android["key_password"]
                      env_lines.append(f"CM_KEY_PASSWORD={ap}")
              except Exception as je:
                  print(f"Warning parsing Android secrets: {te} / {je}")

          if env_lines:
              with open(os.environ["GITHUB_ENV"], "a") as ef:
                  ef.write("\n".join(env_lines) + "\n")
          '
          fi

      - name: Flutter Pub Get & Enable Linux
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Android (APK & App Bundle)
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}
          flutter build appbundle --release --android-skip-build-dependency-validation --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Build Wear OS APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :wear:assembleRelease || true
          cd ..

      - name: Build Linux Desktop
        run: |
          flutter build linux --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}
          cd build/linux/x64/release
          tar -czvf ../../../../${{ env.APP_NAME }}_linux.tar.gz bundle
          cd ../../../..

      - name: Create Linux Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true
          sudo flatpak install -y flathub org.freedesktop.Platform//22.08 org.freedesktop.Sdk//22.08 || true
          echo '{
            "app-id": "${{ env.APP_ID }}",
            "runtime": "org.freedesktop.Platform",
            "runtime-version": "22.08",
            "sdk": "org.freedesktop.Sdk",
            "command": "${{ env.APP_NAME }}",
            "finish-args": [
              "--share=network",
              "--share=ipc",
              "--socket=fallback-x11",
              "--socket=wayland",
              "--device=dri"
            ],
            "modules": [
              {
                "name": "${{ env.APP_NAME }}",
                "buildsystem": "simple",
                "build-commands": [
                  "mkdir -p /app/bin /app/lib/${{ env.APP_NAME }}",
                  "cp -r * /app/lib/${{ env.APP_NAME }}/",
                  "ln -s /app/lib/${{ env.APP_NAME }}/${{ env.APP_NAME }} /app/bin/${{ env.APP_NAME }}",
                  "chmod +x /app/bin/${{ env.APP_NAME }} /app/lib/${{ env.APP_NAME }}/${{ env.APP_NAME }}"
                ],
                "sources": [
                  {
                    "type": "dir",
                    "path": "build/linux/x64/release/bundle"
                  }
                ]
              }
            ]
          }' > ${{ env.APP_ID }}.json
          flatpak-builder --repo=repo --force-clean build-dir ${{ env.APP_ID }}.json || true
          flatpak build-bundle repo ${{ env.APP_NAME }}_linux.flatpak ${{ env.APP_ID }} || true

      - name: Upload Android, Wear OS & Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-linux-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            android/wear/build/outputs/apk/release/*.apk
            ${{ env.APP_NAME }}_linux.tar.gz
            *.flatpak

  build-windows:
    name: Windows (.exe & ZIP)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Windows Environment
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\AppData\Local", "$env:USERPROFILE\AppData\Roaming" | Out-Null
          if (Test-Path "$env:USERPROFILE\AppData") {
            (Get-Item "$env:USERPROFILE\AppData" -Force).Attributes = 'Directory'
          }

      - name: Flutter Enable Windows & Pub Get
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Create Windows ZIP
        shell: powershell
        run: |
          $ReleasePath = if (Test-Path "build\windows\x64\runner\Release") { "build\windows\x64\runner\Release\*" } else { "build\windows\runner\Release\*" }
          Compress-Archive -Path $ReleasePath -DestinationPath ${{ env.APP_NAME }}_windows.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            ${{ env.APP_NAME }}_windows.zip
            build/windows/**/runner/Release/*.exe

  create-release:
    name: Create GitHub Release
    needs: [version, build-apple, build-android-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }} (Build ${{ needs.version.outputs.build_number }})
          files: |
            artifacts/apple-builds/**/*
            artifacts/android-linux-builds/**/*
            artifacts/windows-builds/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
