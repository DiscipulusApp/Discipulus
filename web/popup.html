<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discipulus</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 210px;
      padding: 14px;
      background-color: #141218;
      color: #e6e1e5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .m3-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }

    .m3-btn:active {
      transform: scale(0.96);
    }

    .m3-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* M3 Primary Filled Button */
    .m3-btn-filled {
      background: #d0bcff;
      color: #381e72;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .m3-btn-filled:hover {
      background: #e0d0ff;
      box-shadow: 0 4px 12px rgba(208, 188, 255, 0.35);
    }

    /* M3 Tonal Buttons */
    .m3-btn-tonal {
      background: #2b2930;
      color: #eaddff;
    }

    .m3-btn-tonal:hover {
      background: #36343b;
      color: #ffffff;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 0;
    }

    /* Material 3 Switch */
    .m3-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      cursor: pointer;
      padding: 2px 2px;
    }

    .m3-switch-label {
      font-size: 12px;
      font-weight: 500;
      color: #cac4d0;
    }

    .m3-switch {
      position: relative;
      width: 44px;
      height: 26px;
      flex-shrink: 0;
    }

    .m3-switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 1;
    }

    .m3-switch-track {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 2px solid #938f99;
      background-color: #36343b;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .m3-switch-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #938f99;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    /* Switch Checked State */
    .m3-switch input:checked + .m3-switch-track {
      background-color: #d0bcff;
      border-color: #d0bcff;
    }

    .m3-switch input:checked + .m3-switch-track .m3-switch-thumb {
      transform: translateX(18px);
      background-color: #381e72;
    }
  </style>
</head>
<body>
  <div class="actions">
    <button id="btnTab" class="m3-btn m3-btn-filled">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
      </svg>
      <span>Tabblad</span>
    </button>

    <button id="btnSidebar" class="m3-btn m3-btn-tonal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>
      </svg>
      <span>Zijpaneel</span>
    </button>

    <button id="btnPopup" class="m3-btn m3-btn-tonal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"/><path d="M10 14L21 3"/><rect width="14" height="14" x="4" y="6" rx="2"/>
      </svg>
      <span>Pop-up</span>
    </button>
  </div>

  <div class="divider"></div>

  <label class="m3-switch-row">
    <span class="m3-switch-label">Onthoud keuze</span>
    <div class="m3-switch">
      <input type="checkbox" id="rememberChoice">
      <div class="m3-switch-track">
        <div class="m3-switch-thumb"></div>
      </div>
    </div>
  </label>

  <script src="popup.js"></script>
</body>
</html>
